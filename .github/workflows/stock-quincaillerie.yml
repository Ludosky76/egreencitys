# Vérification horaire des disponibilités fournisseur — boutique quincaillerie.
#
# Toutes les heures : ~95 fiches relues en rotation polie (vendables en
# priorité), mise à jour de assets/data/quincaillerie-stock.json et de la liste
# des liens de paiement actifs, bascule des liens Stripe, alerte (issue +
# email) quand un produit disparaît du site fournisseur.
#
# Secret facultatif à poser dans Settings → Secrets → Actions :
#   STRIPE_SECRET_KEY — permet d'activer/désactiver les Payment Links.
#   Sans lui, tout fonctionne sauf la bascule Stripe (la page masque de toute
#   façon le bouton de paiement d'un article non disponible).
name: stock-quincaillerie
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: stock-quincaillerie
  cancel-in-progress: false
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier les fiches fournisseur
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node .github/stock/verifier.mjs
      - name: Publier l'état de stock
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/quincaillerie-stock.json assets/data/quincaillerie-liens.json
          git diff --cached --quiet && echo "aucun changement" && exit 0
          git commit -m "stock: vérification horaire quincaillerie [skip ci]"
          git pull --rebase origin main
          git push origin main
